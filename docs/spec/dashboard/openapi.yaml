openapi: 3.1.0
info:
  title: WMS API - Dashboard
  version: 1.0.0
  description: API untuk statistik dashboard dan recent stock movements.

servers:
  - url: http://localhost:3000/api

tags:
  - name: Dashboard
    description: Dashboard endpoints

paths:
  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Mendapatkan statistik dashboard
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          description: Periode statistik
          schema:
            type: string
            enum:
              - today
              - week
              - month
            default: week
      responses:
        '200':
          description: Dashboard stats berhasil diambil
        '401':
          description: Unauthorized

  /dashboard/recent-movements:
    get:
      tags: [Dashboard]
      summary: Mendapatkan stock movements terbaru
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Recent movements berhasil diambil
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
