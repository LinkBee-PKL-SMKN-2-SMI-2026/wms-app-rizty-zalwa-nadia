openapi: 3.1.0
info:
  title: WMS API - Categories
  version: 1.0.0
  description: API untuk mengelola kategori produk.

servers:
  - url: http://localhost:3000/api

tags:
  - name: Categories
    description: Category management endpoints

paths:
  /categories:
    post:
      tags: [Categories]
      summary: Membuat kategori
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
            example:
              name: Elektronik
              description: Kategori produk elektronik
      responses:
        '201':
          description: Kategori berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Validasi gagal atau nama kategori sudah digunakan
        '401':
          description: Unauthorized
        '403':
          description: Hanya ADMIN

    get:
      tags: [Categories]
      summary: Mendapatkan semua kategori
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - name_asc
              - name_desc
              - created_asc
              - created_desc
      responses:
        '200':
          description: Data kategori berhasil diambil
        '401':
          description: Unauthorized

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Mendapatkan kategori berdasarkan ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Data kategori berhasil diambil
        '400':
          description: ID kategori tidak valid
        '401':
          description: Unauthorized
        '404':
          description: Kategori tidak ditemukan

    put:
      tags: [Categories]
      summary: Memperbarui kategori
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
            example:
              name: Elektronik Baru
              description: Kategori elektronik
              isActive: true
      responses:
        '200':
          description: Kategori berhasil diperbarui
        '400':
          description: Validasi gagal atau nama kategori sudah digunakan
        '401':
          description: Unauthorized
        '403':
          description: Hanya ADMIN
        '404':
          description: Kategori tidak ditemukan

    delete:
      tags: [Categories]
      summary: Menghapus kategori
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Kategori berhasil dihapus
        '400':
          description: Kategori masih digunakan oleh produk
        '401':
          description: Unauthorized
        '403':
          description: Hanya ADMIN
        '404':
          description: Kategori tidak ditemukan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CategoryId:
      name: id
      in: path
      required: true
      description: UUID kategori
      schema:
        type: string
        format: uuid

  schemas:
    CreateCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          example: Elektronik
        description:
          type: string
          example: Kategori produk elektronik

    UpdateCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          example: Elektronik
        description:
          type: string
          example: Kategori produk elektronik
        isActive:
          type: boolean
          example: true

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Elektronik
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Kategori berhasil dibuat
        data:
          $ref: '#/components/schemas/Category'
