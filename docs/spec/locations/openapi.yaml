openapi: 3.1.0

info:
  title: WMS API - Locations
  version: 1.0.0
  description: API untuk mengelola lokasi gudang.

servers:
  - url: http://localhost:3000/api

tags:
  - name: Locations
    description: Location management endpoints

paths:
  /locations:
    post:
      tags: [Locations]
      summary: Membuat lokasi
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationRequest'
            example:
              name: Rak A1
              code: A1
      responses:
        '201':
          description: Lokasi berhasil dibuat
        '400':
          description: Validasi gagal atau nama/code sudah digunakan
        '401':
          description: Unauthorized
        '403':
          description: Hanya ADMIN

    get:
      tags: [Locations]
      summary: Mendapatkan semua lokasi
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: search
          in: query
          description: Mencari berdasarkan nama atau code lokasi
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [name_asc, name_desc, code_asc, created_desc]
      responses:
        '200':
          description: Data lokasi berhasil diambil
        '401':
          description: Unauthorized

  /locations/{id}:
    get:
      tags: [Locations]
      summary: Mendapatkan lokasi berdasarkan ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LocationId'
      responses:
        '200':
          description: Data lokasi berhasil diambil
        '400':
          description: ID lokasi tidak valid
        '401':
          description: Unauthorized
        '404':
          description: Lokasi tidak ditemukan

    put:
      tags: [Locations]
      summary: Memperbarui lokasi
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LocationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
            example:
              name: Rak A2
              code: A2
              isActive: true
      responses:
        '200':
          description: Lokasi berhasil diperbarui
        '400':
          description: Validasi gagal atau nama/code sudah digunakan
        '401':
          description: Unauthorized
        '403':
          description: Hanya ADMIN
        '404':
          description: Lokasi tidak ditemukan

    delete:
      tags: [Locations]
      summary: Menghapus lokasi
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LocationId'
      responses:
        '200':
          description: Lokasi berhasil dihapus
        '400':
          description: Lokasi masih digunakan oleh produk
        '401':
          description: Unauthorized
        '403':
          description: Hanya ADMIN
        '404':
          description: Lokasi tidak ditemukan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    LocationId:
      name: id
      in: path
      required: true
      description: UUID lokasi
      schema:
        type: string
        format: uuid

  schemas:
    CreateLocationRequest:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          minLength: 3
          example: Rak A1
        code:
          type: string
          minLength: 1
          maxLength: 10
          example: A1

    UpdateLocationRequest:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          minLength: 3
          example: Rak A2
        code:
          type: string
          minLength: 1
          maxLength: 10
          example: A2
        isActive:
          type: boolean
          example: true
